name: Test Suite

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: true

    - name: Check Go formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted correctly:"
          echo "$unformatted"
          echo ""
          echo "Please run 'gofmt -w .' to format your code"
          exit 1
        fi
        echo "All Go files are properly formatted"

  test:
    name: Run Tests
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Install go-junit-report
      run: go install github.com/jstemmer/go-junit-report/v2@latest

    - name: Run tests
      run: |
        go test ./... -v -race 2>&1 | tee test-output.txt || true
        cat test-output.txt | go-junit-report -set-exit-code > test-results.xml

    # Coverage is measured in a second run without -race. Together, every
    # coverage counter update is an atomic operation that the race detector
    # checks, and the similarity tests took about a minute instead of a few
    # seconds without finding anything more. The coverage is the same.
    - name: Measure coverage
      run: go test ./... -coverprofile=coverage.out -covermode=atomic

    - name: Generate coverage report
      run: |
        echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | tail -n 1 | awk '{print "**Total Coverage: " $3 "**"}' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage by Package" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | grep -v "total:" | awk '{print "| " $1 " | " $3 " |"}' | sort -u >> $GITHUB_STEP_SUMMARY

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Go Test Results
        path: test-results.xml
        reporter: 'java-junit'
        fail-on-error: true
        fail-on-empty: true

    - name: Upload coverage to GitHub
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.out

    - name: Check test results
      run: |
        if grep -q 'failures="[1-9]' test-results.xml || grep -q 'errors="[1-9]' test-results.xml; then
          echo "Some tests failed"
          exit 1
        else
          echo "All tests passed"
        fi

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Install e2e dependencies
      working-directory: e2e
      run: npm ci

    # Playwright drives the Google Chrome preinstalled on the runner
    # (channel: 'chrome' in playwright.config.js), so no browser download.
    - name: Run end-to-end tests
      working-directory: e2e
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        path: e2e/playwright-report
