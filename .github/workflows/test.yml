name: Test Suite

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # gofmt needs no Go cache (see the test job).
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: false

    - name: Check Go formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted correctly:"
          echo "$unformatted"
          echo ""
          echo "Please run 'gofmt -w .' to format your code"
          exit 1
        fi
        echo "All Go files are properly formatted"

  test:
    name: Run Tests
    runs-on: ubuntu-26.04
    env:
      # Dependabot does not update this version; bump it by hand.
      GO_JUNIT_REPORT_VERSION: v2.1.0

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: false

    # This job saves the Go module and build cache, and the e2e job restores
    # it. setup-go's own cache is saved by whichever job finishes first,
    # which was the formatting job before anything had been built, so every
    # build started from scratch. The key changes with the Go version and
    # go.sum, the inputs of the packages that take long to build (the
    # standard library and the dependencies, with and without -race).
    # -count=1 keeps the test runs from reusing cached test results, so
    # every test still runs.
    - name: Cache Go modules and builds
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

    - name: Download dependencies
      run: go mod download

    # Building go-junit-report from source takes about 10 s, so the binary
    # of the pinned version is cached.
    - name: Cache go-junit-report
      id: go-junit-report-cache
      uses: actions/cache@v6
      with:
        path: ~/go/bin/go-junit-report
        key: go-junit-report-${{ env.GO_JUNIT_REPORT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install go-junit-report
      if: steps.go-junit-report-cache.outputs.cache-hit != 'true'
      run: go install github.com/jstemmer/go-junit-report/v2@${{ env.GO_JUNIT_REPORT_VERSION }}

    - name: Run tests
      run: |
        go test ./... -v -race -count=1 2>&1 | tee test-output.txt || true
        cat test-output.txt | go-junit-report -set-exit-code > test-results.xml

    # Coverage is measured in a second run, without -race and in the default
    # mode. With -race, every coverage counter update is an atomic operation
    # that the race detector checks, and the similarity tests took about a
    # minute instead of a few seconds without finding anything more. Atomic
    # updates are slow on the runner even without -race. The coverage is the
    # same in every mode.
    - name: Measure coverage
      run: go test ./... -count=1 -coverprofile=coverage.out

    - name: Generate coverage report
      run: |
        echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | tail -n 1 | awk '{print "**Total Coverage: " $3 "**"}' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage by Package" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out | grep -v "total:" | awk '{print "| " $1 " | " $3 " |"}' | sort -u >> $GITHUB_STEP_SUMMARY

    - name: Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Go Test Results
        path: test-results.xml
        reporter: 'java-junit'
        fail-on-error: true
        fail-on-empty: true

    - name: Upload coverage to GitHub
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage.out

    - name: Check test results
      run: |
        if grep -q 'failures="[1-9]' test-results.xml || grep -q 'errors="[1-9]' test-results.xml; then
          echo "Some tests failed"
          exit 1
        else
          echo "All tests passed"
        fi

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache: false

    # The cache the test job saves (same key) already holds the packages
    # the server is built from. This job only restores it.
    - name: Restore Go modules and builds
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Install e2e dependencies
      working-directory: e2e
      run: npm ci

    # Playwright drives the Google Chrome preinstalled on the runner
    # (channel: 'chrome' in playwright.config.js), so no browser download.
    - name: Run end-to-end tests
      working-directory: e2e
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        path: e2e/playwright-report
